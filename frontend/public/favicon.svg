<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Globe Ocean Gradient -->
    <radialGradient id="globeGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Glowing Atmosphere Halo -->
    <radialGradient id="atmosphereGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="95%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9" />
    </radialGradient>

    <!-- Saffron ISRO Swoosh Gradient -->
    <linearGradient id="isroSaffron" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.2" />
      <stop offset="40%" stop-color="#ff7700" />
      <stop offset="80%" stop-color="#ff9933" />
      <stop offset="100%" stop-color="#ffc107" />
    </linearGradient>

    <!-- NDVI Neon Green Gradient -->
    <linearGradient id="ndviNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="saffronGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Globe Base Body (Sphere) -->
  <circle cx="256" cy="270" r="165" fill="url(#globeGrad)" />

  <!-- 2. NDVI Vegetation Continent Contours & Grid Lines -->
  <g filter="url(#neonGlow)">
    <!-- Latitude & Longitude Curvature Lines -->
    <ellipse cx="256" cy="270" rx="165" ry="60" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="8 6" />
    <ellipse cx="256" cy="270" rx="165" ry="120" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.3" />
    <ellipse cx="256" cy="270" rx="70" ry="165" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.35" />

    <!-- Stylized India / South Asia NDVI Landmass Shapes -->
    <!-- India Peninsula Shape -->
    <path d="M 230,175 C 255,160 280,170 295,190 C 310,215 305,240 285,275 C 270,300 256,335 250,345 C 244,335 235,305 220,280 C 205,255 205,225 215,200 Z"
          fill="url(#ndviNeon)" opacity="0.85" />
    
    <!-- Himalayas & Northern Vegetation Arc -->
    <path d="M 180,175 C 220,150 290,145 330,170 C 315,185 285,180 240,185 Z"
          fill="#34d399" opacity="0.9" />

    <!-- East Asia / SE Asian Islands -->
    <path d="M 325,230 Q 355,240 375,275 Q 350,285 330,260 Z" fill="#10b981" opacity="0.7" />
  </g>

  <!-- 3. Globe Atmosphere Outer Ring Rim -->
  <circle cx="256" cy="270" r="165" fill="url(#atmosphereGlow)" />
  <circle cx="256" cy="270" r="165" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8" />

  <!-- 4. ISRO Space Sweeping Launch Swoosh (Saffron-Orange Trajectory) -->
  <g filter="url(#saffronGlow)">
    <!-- Main Launch Orbital Arc -->
    <path d="M 70,410 C 90,260 210,100 390,70 C 440,62 465,70 455,95 C 440,120 380,155 270,225 C 180,282 110,360 70,410 Z"
          fill="url(#isroSaffron)" />
    
    <!-- Sharp Launch Arrow / Satellite Apex Spike -->
    <polygon points="415,50 465,65 440,110" fill="#ffc107" />
    
    <!-- Orbit Particle Dots -->
    <circle cx="440" cy="72" r="7" fill="#ffffff" />
    <circle cx="360" cy="92" r="5" fill="#ffc107" />
    <circle cx="280" cy="125" r="4" fill="#ff7700" opacity="0.8" />
  </g>

  <!-- 5. Sentinel Satellite Crosshair Pulse (Top Right Orbit) -->
  <g transform="translate(435, 72)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#34d399" stroke-width="3" />
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#34d399" stroke-width="3" />
    <circle cx="0" cy="0" r="5" fill="#34d399" />
  </g>
</svg>
